[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oxford-economics-api"
version = "0.1.0"
description = "FastAPI service that proxies the Oxford Economics GMWO 'solve' API."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Oxford Economics Integration Team" }]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Default run skips tests that hit the real Oxford Economics API.
# Opt in with: pytest -m live  (or  -m "live and not slow"  to skip the wait test).
addopts = "-ra --strict-markers -m 'not live'"
markers = [
    "live: hits the real Oxford Economics API; opt-in only via -m live",
    "slow: long-running (e.g. waits for a solve operation to finish)",
    "tokens: live tests that touch /api/v1/tokens",
    "solve: live tests that touch /api/v1/solve",
]
